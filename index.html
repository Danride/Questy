<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<title>360</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5/700.css">
<style>
:root{
  --bg:#0f0f12;
  --ink:#f5efe2;
  --line:rgba(245,239,226,.28);
  --line-soft:rgba(245,239,226,.14);
  --accent:rgba(255,205,150,.55);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Unbounded',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top));
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
  text-align:center;position:relative;
}
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(55% 45% at 50% 42%,rgba(255,180,120,.08),transparent 70%),
             radial-gradient(45% 40% at 20% 85%,rgba(155,92,246,.06),transparent 70%);
}

.frame-outer{position:absolute;inset:6px;border:1px solid var(--line-soft);pointer-events:none}
.frame-outer::before,.frame-outer::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:18px;height:1px;background:var(--line-soft);
}
.frame-outer::before{top:-1px}
.frame-outer::after{bottom:-1px}
.frame-inner{position:absolute;inset:10px;border:1px solid var(--line-soft);pointer-events:none}

.corner{position:absolute;width:9px;height:9px;border:1px solid var(--accent);pointer-events:none}
.corner.tl{top:6px;left:6px;border-right:none;border-bottom:none}
.corner.tr{top:6px;right:6px;border-left:none;border-bottom:none}
.corner.bl{bottom:6px;left:6px;border-right:none;border-top:none}
.corner.br{bottom:6px;right:6px;border-left:none;border-top:none}

.dot{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--accent);pointer-events:none}
.dot.tl{top:6px;left:6px;transform:translate(-50%,-50%)}
.dot.tr{top:6px;right:6px;transform:translate(50%,-50%)}
.dot.bl{bottom:6px;left:6px;transform:translate(-50%,50%)}
.dot.br{bottom:6px;right:6px;transform:translate(50%,50%)}

.content{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(14px,3vh,22px);
  max-width:380px;width:100%;
}

.logo{
  width:clamp(44px,12vw,64px);height:clamp(44px,12vw,64px);
  opacity:0;animation:fadeUp 1s cubic-bezier(.2,1,.3,1) forwards;
  filter:drop-shadow(0 0 10px rgba(255,200,140,.18));
}
.logo svg{width:100%;height:100%;display:block}

.divider{
  display:flex;align-items:center;gap:8px;
  width:40%;opacity:0;animation:fadeIn 1s ease .3s forwards;
}
.divider .line{flex:1;height:1px;background:var(--line)}
.divider .diamond{width:4px;height:4px;transform:rotate(45deg);border:1px solid var(--accent)}

.task-wrap{
  position:relative;
  padding:clamp(18px,4.5vw,26px) clamp(16px,4vw,24px);
  width:100%;
  opacity:0;animation:fadeUp 1s cubic-bezier(.2,1,.3,1) .4s forwards;
}
.task-wrap::before{
  content:"";position:absolute;inset:0;border:1px solid var(--line);
}
.task-wrap .c{position:absolute;width:7px;height:7px;border:1px solid var(--accent)}
.task-wrap .c.tl{top:-1px;left:-1px;border-right:none;border-bottom:none}
.task-wrap .c.tr{top:-1px;right:-1px;border-left:none;border-bottom:none}
.task-wrap .c.bl{bottom:-1px;left:-1px;border-right:none;border-top:none}
.task-wrap .c.br{bottom:-1px;right:-1px;border-left:none;border-top:none}

.task{
  font-weight:400;font-size:clamp(16px,4.4vw,22px);line-height:1.5;
  letter-spacing:-.005em;
  color:var(--ink);
}

.film{
  position:absolute;inset:0;
  overflow:hidden;
  cursor:grab;
  touch-action:none;
  transition:opacity .7s ease, filter .7s ease;
}
.film canvas{
  position:absolute;inset:0;width:100%;height:100%;
  display:block;
}
.film.hint::after{
  content:"Сотри, чтобы открыть ✨";
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:'Unbounded',sans-serif;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(40,30,20,.75);
  pointer-events:none;
  white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.3);
  animation:pulse 2.4s ease-in-out infinite;
}
.film.partial::after{
  content:"Сотри полностью ✨";
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{
  0%,100%{opacity:.55}
  50%{opacity:.95}
}
.film.revealing{
  opacity:0;
  filter:blur(8px);
  pointer-events:none;
}

.progress{
  position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(245,239,226,.5);font-weight:400;
  opacity:0;transition:opacity .3s;
  white-space:nowrap;
  pointer-events:none;
}
.progress.show{opacity:1}

.footer{
  position:relative;
  padding:5px 14px;
  font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,239,226,.55);font-weight:400;
  opacity:0;animation:fadeIn 1s ease .7s forwards;
}
.footer::before{content:"";position:absolute;inset:0;border:1px solid var(--line-soft)}
.footer .mini{position:absolute;width:2.5px;height:2.5px;background:var(--accent);transform:rotate(45deg)}
.footer .mini.l{left:-1.25px;top:50%;transform:translate(-50%,-50%) rotate(45deg)}
.footer .mini.r{right:-1.25px;top:50%;transform:translate(50%,-50%) rotate(45deg)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<div class="frame-outer"></div>
<div class="frame-inner"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div class="dot tl"></div>
<div class="dot tr"></div>
<div class="dot bl"></div>
<div class="dot br"></div>

<div class="content">

  <div class="logo">
    <svg viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="-100" y1="-100" x2="100" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#fff4dd"/>
          <stop offset="50%" stop-color="#ffd29a"/>
          <stop offset="100%" stop-color="#ff8e53"/>
        </linearGradient>
      </defs>
      <path d="M 0 -92 Q 6 -6 92 0 Q 6 6 0 92 Q -6 6 -92 0 Q -6 -6 0 -92 Z" fill="url(#g1)"/>
      <path d="M 0 -92 Q 6 -6 92 0 Q 6 6 0 92 Q -6 6 -92 0 Q -6 -6 0 -92 Z"
            fill="none" stroke="rgba(255,255,255,.35)" stroke-width=".6" transform="scale(.72)"/>
      <path d="M 0 -18 Q 1.5 -1.5 18 0 Q 1.5 1.5 0 18 Q -1.5 1.5 -18 0 Q -1.5 -1.5 0 -18 Z"
            fill="#fff" opacity=".9"/>
    </svg>
  </div>

  <div class="divider">
    <div class="line"></div>
    <div class="diamond"></div>
    <div class="line"></div>
  </div>

  <div class="task-wrap" id="taskWrap">
    <span class="c tl"></span>
    <span class="c tr"></span>
    <span class="c bl"></span>
    <span class="c br"></span>
    <div class="task" id="task"></div>
    <div class="film hint" id="film">
      <canvas id="filmCanvas"></canvas>
    </div>
    <div class="progress" id="progress"></div>
  </div>

  <div class="footer">
    <span class="mini l"></span>
    новое задание каждый день
    <span class="mini r"></span>
  </div>

</div>

<!-- VK Bridge -->
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<script>
/* ================== VK BRIDGE ================== */
const vkBridge = window.vkBridge;

function initVKBridge(){
  if(!vkBridge){
    console.warn('[VK Bridge] не загружен — работаем в обычном режиме');
    return;
  }

  try{
    // Инициализация мини-приложения
    vkBridge.send('VKWebAppInit');

    // Настройка цветов шапки и статус-бара
    vkBridge.send('VKWebAppSetViewSettings',{
      status_bar_style:'light',          // светлый текст в статус-баре
      action_bar_text_color:'#f5efe2',   // цвет текста в action bar
      status_bar_background_color:'#0f0f12',
      action_bar_background_color:'#0f0f12',
      navigation_bar_color:'#0f0f12'
    }).catch(()=>{});

    // Отключаем свайп назад (чтобы не закрывалось приложение случайно)
    vkBridge.send('VKWebAppEnableSwipeBack').catch(()=>{});

    // Слушаем смену темы от VK — если пользователь поменяет тему,
    // можно адаптироваться (пока оставляем свою тему)
    vkBridge.subscribe((e)=>{
      if(!e || !e.detail) return;
      if(e.detail.type==='VKWebAppUpdateConfig'){
        const cfg=e.detail.data||{};
        // appearance: 'light' | 'dark'
        // scheme: 'bright_light' | 'client_light' | 'space_gray' | 'vkcom_light' и т.д.
        const scheme=cfg.appearance||cfg.scheme||'';
        const isDark=/dark|gray|space/i.test(scheme);
        // При желании можно менять тему здесь:
        // document.documentElement.style.setProperty('--bg', isDark?'#0f0f12':'#f5efe2');
        // document.documentElement.style.setProperty('--ink', isDark?'#f5efe2':'#0f0f12');
      }
    });

    console.log('[VK Bridge] инициализирован');
  }catch(err){
    console.warn('[VK Bridge] ошибка инициализации:',err);
  }
}

// Запускаем, когда DOM готов
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded',initVKBridge);
}else{
  initVKBridge();
}

/* ================== ДАННЫЕ ================== */
const TASKS=[
'Покорми голубя','Сегодня ходи во всем белом','Предложи незнакомму человеку в соц.сети тортика','Картавь весь день','Купи шоколадку и подари любому',
'Обнови аватар в соц. сети на капибару ','Посети зоомогазин','Выучи пару фраз на языке жестов','Одень разные носки','Напиши спасибо трем людям за то, что они существуют',
'Спроси у незнакомца, как у него дела' , 'Попробуй блюдо, которое никогда не ел', 'Позвони в случайный магазин и спроси, есть ли у них единороги', 'Сделай селфи с кем-либо', 'Отыграй роль вампира весь день',  'Говори шепотом весь день', 
 'Придумай себе новую личность и побудь ею весь день',  'Опубликуй пост:я хочу чай',  'Найди камень идеальной формы',  'Погладь дерево и скажи ему пару ласковых',  'Разбавь свою речь словом мяу целый день',  






];

/* ================== ЛОГИКА ================== */
function dateKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function seededIndex(seed,len){let h=2166136261>>>0;for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}return(h>>>0)%len;}

const taskEl=document.getElementById('task');
const film=document.getElementById('film');
const canvas=document.getElementById('filmCanvas');
const ctx=canvas.getContext('2d');
const progressEl=document.getElementById('progress');

taskEl.textContent=TASKS[seededIndex(dateKey(),TASKS.length)];

setupFilm();

function setupFilm(){
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const rect=film.getBoundingClientRect();
  canvas.width=rect.width*dpr;
  canvas.height=rect.height*dpr;
  ctx.scale(dpr,dpr);
  drawFilmBase(rect.width,rect.height);

  let drawing=false;
  let lastX=null,lastY=null;
  let strokes=0;
  let revealed=false;

  const RADIUS=26;
  const REVEAL_THRESHOLD=0.92;

  function pos(e){
    const r=film.getBoundingClientRect();
    const t=e.touches?e.touches[0]:e;
    return {x:t.clientX-r.left,y:t.clientY-r.top};
  }
  function erase(x,y){
    ctx.globalCompositeOperation='destination-out';
    ctx.beginPath();
    if(lastX!==null){
      ctx.lineWidth=RADIUS*2;
      ctx.lineCap='round';
      ctx.lineJoin='round';
      ctx.moveTo(lastX,lastY);
      ctx.lineTo(x,y);
      ctx.stroke();
    }else{
      ctx.fillStyle='rgba(0,0,0,1)';
      ctx.beginPath();
      ctx.arc(x,y,RADIUS,0,Math.PI*2);
      ctx.fill();
    }
    lastX=x;lastY=y;
  }

  function computePercent(){
    const w=canvas.width,h=canvas.height;
    const data=ctx.getImageData(0,0,w,h).data;
    let transparent=0,total=0;
    const step=32*4;
    for(let i=3;i<data.length;i+=step){
      total++;
      if(data[i]===0) transparent++;
    }
    return total>0 ? transparent/total : 0;
  }

  function checkReveal(){
    if(revealed)return;
    const pct=computePercent();

    if(pct>0.05 && pct<REVEAL_THRESHOLD){
      progressEl.textContent=Math.round(pct*100)+'%';
      progressEl.classList.add('show');
      film.classList.add('partial');
      film.classList.remove('hint');
    }else if(pct<=0.05){
      progressEl.classList.remove('show');
      film.classList.add('hint');
      film.classList.remove('partial');
    }

    if(pct>=REVEAL_THRESHOLD){
      revealed=true;
      progressEl.textContent='✓';
      progressEl.classList.add('show');
      film.classList.remove('hint','partial');
      film.classList.add('revealing');

      // Вибрация через VK Bridge (если поддерживается)
      if(vkBridge){
        vkBridge.send('VKWebAppTapticImpactOccurred',{style:'medium'}).catch(()=>{});
      }else if(navigator.vibrate){
        navigator.vibrate(20);
      }

      setTimeout(()=>{
        if(film.parentNode) film.remove();
        progressEl.classList.remove('show');
      },750);
    }
  }

  function start(e){
    e.preventDefault();
    drawing=true;
    film.classList.remove('hint');
    const p=pos(e);lastX=p.x;lastY=p.y;
    erase(p.x,p.y);
  }
  function move(e){
    if(!drawing)return;
    e.preventDefault();
    const p=pos(e);
    erase(p.x,p.y);
    strokes++;
    if(strokes%4===0) checkReveal();
  }
  function end(){
    if(!drawing)return;
    drawing=false;lastX=null;lastY=null;
    checkReveal();
  }

  film.addEventListener('touchstart',start,{passive:false});
  film.addEventListener('touchmove',move,{passive:false});
  film.addEventListener('touchend',end);
  film.addEventListener('mousedown',start);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',end);
}

function drawFilmBase(w,h){
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#d9d4c7');
  g.addColorStop(0.35,'#efeae0');
  g.addColorStop(0.55,'#c9c2b2');
  g.addColorStop(0.8,'#e5dfd1');
  g.addColorStop(1,'#b8b1a1');
  ctx.fillStyle=g;
  ctx.fillRect(0,0,w,h);

  ctx.save();
  ctx.globalAlpha=0.18;
  for(let i=-h;i<w+h;i+=22){
    ctx.strokeStyle='rgba(255,255,255,.6)';
    ctx.lineWidth=1;
    ctx.beginPath();
    ctx.moveTo(i,0);
    ctx.lineTo(i+h,h);
    ctx.stroke();
  }
  ctx.restore();

  ctx.save();
  ctx.globalAlpha=0.08;
  ctx.strokeStyle='#000';
  ctx.lineWidth=0.5;
  for(let y=0;y<h;y+=4){
    ctx.beginPath();
    ctx.moveTo(0,y);
    ctx.lineTo(w,y);
    ctx.stroke();
  }
  ctx.restore();

  const shine=ctx.createLinearGradient(0,0,0,h);
  shine.addColorStop(0,'rgba(255,255,255,.35)');
  shine.addColorStop(0.25,'rgba(255,255,255,0)');
  shine.addColorStop(0.75,'rgba(0,0,0,0)');
  shine.addColorStop(1,'rgba(0,0,0,.12)');
  ctx.fillStyle=shine;
  ctx.fillRect(0,0,w,h);
}

let resizeTimer;
window.addEventListener('resize',()=>{
  if(film.parentNode && !film.classList.contains('revealing')){
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      const dpr=Math.max(1,window.devicePixelRatio||1);
      const rect=film.getBoundingClientRect();
      canvas.width=rect.width*dpr;
      canvas.height=rect.height*dpr;
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr,dpr);
      drawFilmBase(rect.width,rect.height);
    },200);
  }
});
</script>
</body>
</html>
