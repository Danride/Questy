<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0f12">
<title>360</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/unbounded@5/700.css">
<style>
:root{
  --bg:#0f0f12;
  --ink:#f5efe2;
  --line:rgba(245,239,226,.28);
  --line-soft:rgba(245,239,226,.14);
  --accent:rgba(255,205,150,.55);
  --accent-soft:rgba(255,205,150,.25);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{
  background:var(--bg);color:var(--ink);
  font-family:'Unbounded',system-ui,sans-serif;
  display:flex;align-items:center;justify-content:center;
  padding:14px;
  padding-top:calc(14px + env(safe-area-inset-top));
  padding-bottom:calc(14px + env(safe-area-inset-bottom) + var(--ad-banner-height, 0px));
  text-align:center;position:relative;
  transition:padding-bottom .3s ease;
}
body::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(55% 45% at 50% 42%,rgba(255,180,120,.08),transparent 70%),
             radial-gradient(45% 40% at 20% 85%,rgba(155,92,246,.06),transparent 70%);
}

.bg-symbols{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.bg-sym{
  position:absolute;pointer-events:auto;cursor:pointer;
  color:var(--accent);font-family:'Unbounded',sans-serif;font-weight:700;
  opacity:0;
  animation:symFadeIn 1.2s ease forwards, symDrift var(--drift-dur,12s) linear var(--drift-delay,0s) infinite;
  transition:transform .25s ease, opacity .25s ease;
  text-shadow:0 0 8px rgba(255,200,140,.35);
  will-change:transform;
}
.bg-sym:hover{transform:scale(1.25);color:#ffd29a}
.bg-sym:active{transform:scale(.85)}
@keyframes symFadeIn{from{opacity:0;filter:blur(4px)}to{opacity:var(--sym-opacity,.35);filter:blur(0)}}
@keyframes symDrift{
  0%{transform:translate(0,0) rotate(var(--sym-rot,0deg))}
  25%{transform:translate(var(--dx1,30px),var(--dy1,-40px)) rotate(calc(var(--sym-rot,0deg) + 15deg))}
  50%{transform:translate(var(--dx2,-20px),var(--dy2,-80px)) rotate(calc(var(--sym-rot,0deg) - 10deg))}
  75%{transform:translate(var(--dx3,-50px),var(--dy3,-30px)) rotate(calc(var(--sym-rot,0deg) + 8deg))}
  100%{transform:translate(0,0) rotate(var(--sym-rot,0deg))}
}
.burst{
  position:absolute;pointer-events:none;
  font-family:'Unbounded',sans-serif;font-weight:700;
  color:var(--accent);text-shadow:0 0 6px rgba(255,200,140,.6);
  animation:burstFly .9s cubic-bezier(.2,.7,.3,1) forwards;
  will-change:transform,opacity;
}
@keyframes burstFly{
  0%{transform:translate(-50%,-50%) translate(0,0) rotate(0deg) scale(1);opacity:1}
  100%{transform:translate(-50%,-50%) translate(var(--bx),var(--by)) rotate(var(--br)) scale(.3);opacity:0}
}

.frame-outer{position:absolute;inset:6px;border:1px solid var(--line-soft);pointer-events:none;z-index:3}
.frame-outer::before,.frame-outer::after{
  content:"";position:absolute;left:50%;transform:translateX(-50%);
  width:18px;height:1px;background:var(--line-soft);
}
.frame-outer::before{top:-1px}
.frame-outer::after{bottom:-1px}
.frame-inner{position:absolute;inset:10px;border:1px solid var(--line-soft);pointer-events:none;z-index:3}

.corner{position:absolute;width:9px;height:9px;border:1px solid var(--accent);pointer-events:none;z-index:3}
.corner.tl{top:6px;left:6px;border-right:none;border-bottom:none}
.corner.tr{top:6px;right:6px;border-left:none;border-bottom:none}
.corner.bl{bottom:6px;left:6px;border-right:none;border-top:none}
.corner.br{bottom:6px;right:6px;border-left:none;border-top:none}

.dot{position:absolute;width:2px;height:2px;border-radius:50%;background:var(--accent);pointer-events:none;z-index:3}
.dot.tl{top:6px;left:6px;transform:translate(-50%,-50%)}
.dot.tr{top:6px;right:6px;transform:translate(50%,-50%)}
.dot.bl{bottom:6px;left:6px;transform:translate(-50%,50%)}
.dot.br{bottom:6px;right:6px;transform:translate(50%,50%)}

.content{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  gap:clamp(12px,2.5vh,18px);
  max-width:380px;width:100%;
}

.logo{
  width:clamp(44px,12vw,64px);height:clamp(44px,12vw,64px);
  opacity:0;animation:fadeUp 1s cubic-bezier(.2,1,.3,1) forwards;
  filter:drop-shadow(0 0 10px rgba(255,200,140,.18));
}
.logo svg{width:100%;height:100%;display:block}

.divider{
  display:flex;align-items:center;gap:8px;
  width:40%;opacity:0;animation:fadeIn 1s ease .3s forwards;
}
.divider .line{flex:1;height:1px;background:var(--line)}
.divider .diamond{width:4px;height:4px;transform:rotate(45deg);border:1px solid var(--accent)}

.tabs{display:flex;gap:6px;width:100%;opacity:0;animation:fadeIn 1s ease .35s forwards}
.tab{
  flex:1;position:relative;background:transparent;
  border:1px solid var(--line);color:var(--ink);
  font-family:'Unbounded',sans-serif;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  padding:10px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;
  transition:border-color .25s,background .25s,opacity .25s,color .25s;
}
.tab .co{position:absolute;width:6px;height:6px;border:1px solid var(--accent);pointer-events:none;opacity:.9}
.tab .co.tl{top:-1px;left:-1px;border-right:none;border-bottom:none}
.tab .co.tr{top:-1px;right:-1px;border-left:none;border-bottom:none}
.tab .co.bl{bottom:-1px;left:-1px;border-right:none;border-top:none}
.tab .co.br{bottom:-1px;right:-1px;border-left:none;border-top:none}
.tab .co::before{content:"";position:absolute;width:2px;height:2px;background:var(--accent)}
.tab .co.tl::before{top:-1px;right:-1px;transform:translate(50%,-50%)}
.tab .co.tr::before{top:-1px;left:-1px;transform:translate(-50%,-50%)}
.tab .co.bl::before{bottom:-1px;right:-1px;transform:translate(50%,50%)}
.tab .co.br::before{bottom:-1px;left:-1px;transform:translate(-50%,50%)}

.tab.active{border-color:var(--accent);background:rgba(255,205,150,.08)}
.tab.active .co{border-color:var(--accent)}
.tab.locked{opacity:.5}
.tab.locked .co{border-color:var(--line);opacity:.6}
.tab.locked .co::before{background:var(--line)}
.tab:active{background:rgba(255,205,150,.14)}

.task-row{
  display:flex;align-items:stretch;gap:8px;
  width:100%;
  opacity:0;animation:fadeUp 1s cubic-bezier(.2,1,.3,1) .4s forwards;
}
.task-wrap{
  position:relative;flex:1;
  padding:clamp(18px,4.5vw,26px) clamp(16px,4vw,24px);
}
.task-wrap::before{content:"";position:absolute;inset:0;border:1px solid var(--line)}
.task-wrap .c{position:absolute;width:7px;height:7px;border:1px solid var(--accent)}
.task-wrap .c.tl{top:-1px;left:-1px;border-right:none;border-bottom:none}
.task-wrap .c.tr{top:-1px;right:-1px;border-left:none;border-bottom:none}
.task-wrap .c.bl{bottom:-1px;left:-1px;border-right:none;border-top:none}
.task-wrap .c.br{bottom:-1px;right:-1px;border-left:none;border-top:none}

.task{
  font-weight:400;font-size:clamp(16px,4.4vw,22px);line-height:1.5;
  letter-spacing:-.005em;color:var(--ink);
}

.reroll-btn{
  position:relative;
  width:44px;min-height:44px;
  background:transparent;
  border:1px solid var(--line);
  color:var(--ink);
  cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  font-family:'Unbounded',sans-serif;
  transition:border-color .25s,background .25s,transform .3s, opacity .3s;
  padding:4px;
  flex-shrink:0;
}
.reroll-btn .ico{font-size:16px;line-height:1;transition:transform .5s cubic-bezier(.2,1,.3,1)}
.reroll-btn .lbl{
  font-size:7px;letter-spacing:.08em;text-transform:uppercase;
  color:rgba(245,239,226,.6);
}
.reroll-btn:active{background:rgba(255,205,150,.14)}
.reroll-btn:active .ico{transform:rotate(360deg)}
.reroll-btn.loading{pointer-events:none;opacity:.6}
.reroll-btn.loading .ico{animation:spin 1s linear infinite}
.reroll-btn.disabled{pointer-events:none;opacity:0.4;cursor:not-allowed}
@keyframes spin{to{transform:rotate(360deg)}}

.film{
  position:absolute;inset:0;overflow:hidden;
  cursor:grab;touch-action:none;
  transition:opacity 1.3s ease, filter 1.3s ease;
}
.film canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.film.hint::after{
  content:"Сотри, чтобы открыть";
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  font-family:'Unbounded',sans-serif;
  font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:rgba(40,30,20,.85);pointer-events:none;white-space:nowrap;
  text-shadow:0 1px 0 rgba(255,255,255,.3);
  animation:pulse 2.4s ease-in-out infinite;
}
.film.partial::after{content:"Сотри полностью";animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:.95}}
.film.revealing{opacity:0;filter:blur(14px);pointer-events:none}

.progress{
  position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);
  font-size:9px;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(245,239,226,.5);font-weight:400;
  opacity:0;transition:opacity .3s;white-space:nowrap;pointer-events:none;
}
.progress.show{opacity:1}

.actions{
  display:flex;gap:6px;width:100%;
  opacity:0;animation:fadeIn 1s ease .55s forwards;
}
.share-btn{
  flex:1;position:relative;
  padding:9px 10px;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:transparent;
  border:1px solid var(--accent);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;
  font-family:'Unbounded',sans-serif;
  transition:background .25s;
}
.share-btn:active{background:rgba(255,205,150,.14)}
.share-btn .ico{font-size:12px}

.footer{
  position:relative;padding:5px 14px;
  font-size:8px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,239,226,.55);font-weight:400;
  opacity:0;animation:fadeIn 1s ease .7s forwards;
}
.footer::before{content:"";position:absolute;inset:0;border:1px solid var(--line-soft)}
.footer .mini{position:absolute;width:2.5px;height:2.5px;background:var(--accent);transform:rotate(45deg)}
.footer .mini.l{left:-1.25px;top:50%;transform:translate(-50%,-50%) rotate(45deg)}
.footer .mini.r{right:-1.25px;top:50%;transform:translate(50%,-50%) rotate(45deg)}

.modal-backdrop{
  position:fixed;inset:0;z-index:100;
  background:rgba(10,10,12,.85);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  display:flex;align-items:center;justify-content:center;
  padding:20px;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.modal-backdrop.show{opacity:1;pointer-events:auto}

.modal{
  position:relative;
  max-width:340px;width:100%;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  padding:18px 16px;
  transform:scale(.95);transition:transform .3s cubic-bezier(.2,1,.3,1);
}
.modal-backdrop.show .modal{transform:scale(1)}

.modal::before{content:"";position:absolute;inset:0;border:1px solid var(--line)}
.modal .mc{position:absolute;width:8px;height:8px;border:1px solid var(--accent)}
.modal .mc.tl{top:-1px;left:-1px;border-right:none;border-bottom:none}
.modal .mc.tr{top:-1px;right:-1px;border-left:none;border-bottom:none}
.modal .mc.bl{bottom:-1px;left:-1px;border-right:none;border-top:none}
.modal .mc.br{bottom:-1px;right:-1px;border-left:none;border-top:none}

.modal-title{
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(245,239,226,.7);
}

.modal-card{
  width:100%;aspect-ratio:4/5;
  background:#0f0f12;
  border:1px solid var(--line);
  position:relative;
  overflow:hidden;
}
.modal-card canvas{width:100%;height:100%;display:block}

.modal-hint{
  font-size:8px;letter-spacing:.15em;text-transform:uppercase;
  color:rgba(245,239,226,.5);
  text-align:center;line-height:1.6;
}

.modal-actions{display:flex;gap:8px;width:100%}
.modal-btn{
  flex:1;position:relative;
  padding:10px 8px;
  font-size:9px;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:transparent;
  border:1px solid var(--accent);cursor:pointer;
  font-family:'Unbounded',sans-serif;
  display:flex;align-items:center;justify-content:center;gap:6px;
  transition:background .25s;
}
.modal-btn:active{background:rgba(255,205,150,.14)}
.modal-btn.secondary{border-color:var(--line)}
.modal-btn .ico{font-size:12px}

.modal-close{
  position:absolute;top:-14px;right:-14px;
  width:28px;height:28px;
  background:var(--bg);border:1px solid var(--line);
  color:var(--ink);cursor:pointer;
  font-family:'Unbounded',sans-serif;font-size:12px;
  display:flex;align-items:center;justify-content:center;
  z-index:2;
  transition:border-color .25s;
}
.modal-close:active{border-color:var(--accent)}

@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
</style>
</head>
<body>

<div class="bg-symbols" id="bgSymbols"></div>

<div class="frame-outer"></div>
<div class="frame-inner"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>
<div class="dot tl"></div>
<div class="dot tr"></div>

<div class="dot br"></div>

<div class="content">

  <div class="logo">
    <svg viewBox="-100 -100 200 200" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="-100" y1="-100" x2="100" y2="100" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#fff4dd"/>

          <stop offset="100%" stop-color="#ff8e53"/>
        </linearGradient>
      </defs>

      <path d="M 0 -18 Q 1.5 -1.5 18 0 Q 1.5 1.5 0 18 Q -1.5 1.5 -18 0 Q -1.5 -1.5 0 -18 Z"

        <span class="ico">↓</span><span>Сохранить</span>
      </button>

</div>

<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>

<script>
const APP_URL = 'https://vk.ru/app54747359';
const APP_NAME = '360';
const REROLL_PRICE = 0;
const MAX_REROLLS_PER_DAY = 3;

(function initBgSymbols(){
  const container=document.getElementById('bgSymbols');
  const glyphs=['✦','✧','!','!','!','★','✶','!','·','✴','!','!'];
  const COUNT=26;
  function rand(min,max){return Math.random()*(max-min)+min}

  function spawnSymbol(){
    const el=document.createElement('span');
    el.className='bg-sym';
    el.textContent=glyphs[Math.floor(Math.random()*glyphs.length)];
    const size=rand(14,28);
    const x=rand(3,95),y=rand(3,92);
    const opacity=rand(.2,.5);
    const rot=rand(-30,30);
    const driftDur=rand(10,18);
    const driftDelay=rand(0,3);
    const fadeDelay=rand(0,1.5);
    const dx1=rand(-80,80),dy1=rand(-100,100);
    const dx2=rand(-100,100),dy2=rand(-120,120);
    const dx3=rand(-90,90),dy3=rand(-80,80);

    el.style.left=x+'%';el.style.top=y+'%';
    el.style.fontSize=size+'px';
    el.style.setProperty('--sym-opacity',opacity.toFixed(2));
    el.style.setProperty('--sym-rot',rot+'deg');
    el.style.setProperty('--drift-dur',driftDur+'s');
    el.style.setProperty('--drift-delay',driftDelay+'s');
    el.style.setProperty('--dx1',dx1+'px');el.style.setProperty('--dy1',dy1+'px');
    el.style.setProperty('--dx2',dx2+'px');el.style.setProperty('--dy2',dy2+'px');
    el.style.setProperty('--dx3',dx3+'px');el.style.setProperty('--dy3',dy3+'px');
    el.style.animationDelay=fadeDelay+'s,'+driftDelay+'s';
    el.style.animationDuration='1.2s,'+driftDur+'s';

    el.addEventListener('click',(e)=>{e.stopPropagation();burst(el)});
    container.appendChild(el);
  }

  function burst(sym){
    const rect=sym.getBoundingClientRect();
    const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
    const count=7+Math.floor(Math.random()*4);
    for(let i=0;i<count;i++){
      const p=document.createElement('span');
      p.className='burst';
      const pick=Math.random();
      p.textContent = pick<0.3 ? '✦' : pick<0.5 ? '·' : pick<0.8 ? '!' : '✧';
      const angle=(Math.PI*2)*(i/count)+rand(-.3,.3);
      const dist=rand(55,130);
      p.style.left=cx+'px';p.style.top=cy+'px';
      p.style.fontSize=rand(10,18)+'px';
      p.style.setProperty('--bx',Math.cos(angle)*dist+'px');
      p.style.setProperty('--by',Math.sin(angle)*dist+'px');
      p.style.setProperty('--br',rand(-360,360)+'deg');
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),950);
    }
    sym.style.transition='transform .3s ease, opacity .3s ease';
    sym.style.transform='scale(1.8)';sym.style.opacity='0';
    setTimeout(()=>sym.remove(),300);
    setTimeout(spawnSymbol, rand(800,2200));
  }

  for(let i=0;i<COUNT;i++) spawnSymbol();
})();

const vkBridge = window.vkBridge;

/* ============================================================
   БАННЕРНАЯ РЕКЛАМА
   ============================================================ */
function initBannerAd(){
  if(!vkBridge) return;

  vkBridge.subscribe((event) => {
    if(!event.detail) return;

    if(event.detail.type === 'VKWebAppBannerAdReceived'){
      const height = (event.detail.data && event.detail.data.banner_height) || 80;
      document.body.style.setProperty('--ad-banner-height', height + 'px');
    }

    if(event.detail.type === 'VKWebAppBannerAdClosed' ||
       event.detail.type === 'VKWebAppBannerAdHidden'){
      document.body.style.setProperty('--ad-banner-height', '0px');
    }
  });

  vkBridge.send('VKWebAppCheckBannerAd')
    .then(r => {
      if(r && r.result){
        return vkBridge.send('VKWebAppShowBannerAd', {
          banner_location: 'bottom'
        });
      }

function vkStorageSet(key, value){
  // Локальный кэш
  try{ localStorage.setItem('g_'+key, value); }catch(e){}
  // Основное хранилище — VK
  if(vkBridge){
    return vkBridge.send('VKWebAppStorageSet',{key,value}).catch(()=>{});
  }
  return Promise.resolve();
}

function dateKey(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function seededIndex(seed,len){
  let h=2166136261>>>0;
  for(let i=0;i<seed.length;i++){h^=seed.charCodeAt(i);h=Math.imul(h,16777619);}
  return(h>>>0)%len;
}

/* ============================================================
   ЗАГРУЗКА ПРОГРЕССА — приоритет VK Storage
   ============================================================ */
async function loadProgress(){
  const keys = [
    'used_' + dateKey(),
    'rerolls_' + dateKey(),
    'unlock_hard_' + dateKey(),
    'unlock_adult_' + dateKey(),
    'full_access_purchase_date'
  ];

  let data = {};

  if(vkBridge){
    try{
      const r = await vkBridge.send('VKWebAppStorageGet', { keys });
      (r && r.keys || []).forEach(k => { data[k.key] = k.value; });
    }catch(e){
      console.warn('[Storage] VK Storage недоступен:', e);
    }
  }

  // Дополняем из localStorage, если чего-то нет в VK Storage
  keys.forEach(k => {
    if(!data[k]){
      try{
        data[k] = localStorage.getItem('g_'+k) || localStorage.getItem(k) || '';
      }catch(e){ data[k] = ''; }
    }
  });

  // Сбрасываем и заполняем заново
  usedToday.normal.clear();
  usedToday.hard.clear();
  usedToday.adult.clear();

  try{
    const rawUsed = data['used_' + dateKey()];
    if(rawUsed){
      const parsed = JSON.parse(rawUsed);
      if(parsed.normal) parsed.normal.forEach(i => usedToday.normal.add(i));
      if(parsed.hard) parsed.hard.forEach(i => usedToday.hard.add(i));
      if(parsed.adult) parsed.adult.forEach(i => usedToday.adult.add(i));
    }
  }catch(e){ console.warn('[Storage] used parse error', e); }

  const rawRerolls = data['rerolls_' + dateKey()];
  rerollsToday = rawRerolls ? parseInt(rawRerolls, 10) : 0;
  if(isNaN(rerollsToday)) rerollsToday = 0;

  unlocked.hard = data['unlock_hard_' + dateKey()] === '1';
  unlocked.adult = data['unlock_adult_' + dateKey()] === '1';

  const purchaseDateStr = data['full_access_purchase_date'];
  if(purchaseDateStr){
    const diffDays = (Date.now() - new Date(purchaseDateStr).getTime()) / 86400000;
    fullAccess = diffDays <= 365;
  } else {
    fullAccess = false;
  }

  updateRerollUI();
  updateLocks();
}

function pickTaskIndex(cat, excludeIndex=-1){
  const list=CATEGORY_TASKS[cat];
  const used=usedToday[cat];

  if(used.size >= list.length){
    used.clear();
    if(excludeIndex>=0) used.add(excludeIndex);
  }

  const available=[];
  for(let i=0;i<list.length;i++){
    if(i!==excludeIndex && !used.has(i)) available.push(i);
  }
  if(available.length===0){
    for(let i=0;i<list.length;i++){
      if(i!==excludeIndex) available.push(i);
    }
  }
  const idx=available[Math.floor(Math.random()*available.length)];
  used.add(idx);
  saveUsedToday();
  return idx;
}

function drawFilmBase(ctx,w,h){
  const g=ctx.createLinearGradient(0,0,w,h);
  g.addColorStop(0,'#d9d4c7');g.addColorStop(0.35,'#efeae0');
  g.addColorStop(0.55,'#c9c2b2');g.addColorStop(0.8,'#e5dfd1');
  g.addColorStop(1,'#b8b1a1');
  ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
  ctx.save();ctx.globalAlpha=0.18;
  for(let i=-h;i<w+h;i+=22){
    ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(i,0);ctx.lineTo(i+h,h);ctx.stroke();
  }
  ctx.restore();
  ctx.save();ctx.globalAlpha=0.08;ctx.strokeStyle='#000';ctx.lineWidth=0.5;
  for(let y=0;y<h;y+=4){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke();}
  ctx.restore();
  const shine=ctx.createLinearGradient(0,0,0,h);
  shine.addColorStop(0,'rgba(255,255,255,.35)');
  shine.addColorStop(0.25,'rgba(255,255,255,0)');
  shine.addColorStop(0.75,'rgba(0,0,0,0)');
  shine.addColorStop(1,'rgba(0,0,0,.12)');
  ctx.fillStyle=shine;ctx.fillRect(0,0,w,h);
}

function initFilmInteraction(film, canvas){
  const ctx=canvas.getContext('2d');
  const dpr=Math.max(1,window.devicePixelRatio||1);
  const rect=film.getBoundingClientRect();
  canvas.width=rect.width*dpr;canvas.height=rect.height*dpr;
  ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr,dpr);
  drawFilmBase(ctx,rect.width,rect.height);

  let drawing=false,lastX=null,lastY=null,revealed=false,checkScheduled=false;
  const RADIUS=26,SOFT_RADIUS=34,REVEAL_THRESHOLD=0.80;

  function pos(e){const r=film.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top}}
  function stamp(x,y){
    const grad=ctx.createRadialGradient(x,y,0,x,y,SOFT_RADIUS);
    grad.addColorStop(0,'rgba(0,0,0,1)');grad.addColorStop(0.55,'rgba(0,0,0,1)');
    grad.addColorStop(0.85,'rgba(0,0,0,0.6)');grad.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=grad;ctx.beginPath();ctx.arc(x,y,SOFT_RADIUS,0,Math.PI*2);ctx.fill();
  }
  function erase(x,y){
    ctx.globalCompositeOperation='destination-out';
    if(lastX!==null){
      const dist=Math.hypot(x-lastX,y-lastY);
      const step=RADIUS*0.35;
      const steps=Math.max(1,Math.ceil(dist/step));
      for(let i=1;i<=steps;i++){
        stamp(lastX+(x-lastX)*(i/steps), lastY+(y-lastY)*(i/steps));
      }
    }else stamp(x,y);
    lastX=x;lastY=y;
  }
  function computePercent(){
    const w=canvas.width,h=canvas.height;
    const data=ctx.getImageData(0,0,w,h).data;
    let transparent=0,total=0;const step=32*4;
    for(let i=3;i<data.length;i+=step){total++;if(data[i]===0) transparent++;}
    return total>0 ? transparent/total : 0;
  }
  function scheduleCheck(){
    if(checkScheduled) return;checkScheduled=true;
    requestAnimationFrame(()=>{checkScheduled=false;checkReveal()});
  }
  function checkReveal(){
    if(revealed)return;
    const pct=computePercent();
    if(pct>0.05 && pct<REVEAL_THRESHOLD){
      progressEl.textContent=Math.round(pct*100)+'%';
      progressEl.classList.add('show');
      film.classList.add('partial');film.classList.remove('hint');
    }else if(pct<=0.05){
      progressEl.classList.remove('show');
      film.classList.add('hint');film.classList.remove('partial');
    }
    if(pct>=REVEAL_THRESHOLD){
      revealed=true;
      progressEl.textContent='✓';progressEl.classList.add('show');
      film.classList.remove('hint','partial');film.classList.add('revealing');
      if(vkBridge) vkBridge.send('VKWebAppTapticImpactOccurred',{style:'medium'}).catch(()=>{});
      else if(navigator.vibrate) navigator.vibrate(20);
      setTimeout(()=>{
        if(film.parentNode) film.remove();
        progressEl.classList.remove('show');
      },1300);
    }
  }
  function start(e){
    e.preventDefault();drawing=true;film.classList.remove('hint');
    if(film.setPointerCapture){try{film.setPointerCapture(e.pointerId)}catch(err){}}
    const p=pos(e);lastX=p.x;lastY=p.y;erase(p.x,p.y);scheduleCheck();
  }
  function move(e){if(!drawing)return;e.preventDefault();const p=pos(e);erase(p.x,p.y);scheduleCheck()}
  function end(){if(!drawing)return;drawing=false;lastX=null;lastY=null;checkReveal()}

  film.addEventListener('pointerdown',start);
  film.addEventListener('pointermove',move);
  film.addEventListener('pointerup',end);
  film.addEventListener('pointercancel',end);
  film.addEventListener('pointerleave',e=>{if(drawing) end()});

  let resizeTimer;
  window.addEventListener('resize',()=>{
    if(!film.parentNode || film.classList.contains('revealing')) return;
    clearTimeout(resizeTimer);
    resizeTimer=setTimeout(()=>{
      const dpr2=Math.max(1,window.devicePixelRatio||1);
      const r2=film.getBoundingClientRect();
      canvas.width=r2.width*dpr2;canvas.height=r2.height*dpr2;
      ctx.setTransform(1,0,0,1,0,0);ctx.scale(dpr2,dpr2);
      drawFilmBase(ctx,r2.width,r2.height);
    },200);
  });
}

function switchCategory(cat, forceNew=false){
  currentCategory=cat;
  [...tabsEl.querySelectorAll('.tab')].forEach(btn=>{
    btn.classList.toggle('active', btn.dataset.cat===cat);
  });
  const list=CATEGORY_TASKS[cat];

  if(forceNew){
    currentTaskIndex = pickTaskIndex(cat, currentTaskIndex);
    currentSeed = dateKey()+':'+cat+':'+currentTaskIndex+':'+Math.random();
  }else if(currentSeed && currentSeed.startsWith(dateKey()+':'+cat)){
  }else{
    currentTaskIndex = seededIndex(dateKey()+':'+cat, list.length);
    currentSeed = dateKey()+':'+cat;
    usedToday[cat].add(currentTaskIndex);
    saveUsedToday();
  }

  taskEl.textContent=list[currentTaskIndex];
  buildFilm();
}

function updateLocks(){
  [...tabsEl.querySelectorAll('.tab')].forEach(btn=>{
    const cat=btn.dataset.cat;
    if(cat==='normal'){ btn.classList.remove('locked'); return; }
    const isOpen = fullAccess || unlocked[cat];
    btn.classList.toggle('locked', !isOpen);
  });
}

function doReroll(){
  if(rerollBtn.classList.contains('loading') || rerollBtn.classList.contains('disabled')) return;
  if(rerollsToday >= MAX_REROLLS_PER_DAY) return;

  if(currentCategory!=='normal' && !fullAccess && !unlocked[currentCategory]){
    requestUnlock(currentCategory);
    return;
  }

  rerollBtn.classList.add('loading');

  const grant=()=>{
    switchCategory(currentCategory, true);
    rerollsToday++;
    saveRerollsToday();
    updateRerollUI();
    setTimeout(()=>rerollBtn.classList.remove('loading'), 500);
    if(vkBridge) vkBridge.send('VKWebAppTapticImpactOccurred',{style:'light'}).catch(()=>{});
    else if(navigator.vibrate) navigator.vibrate(10);
  };

  const fail=()=>{
    rerollBtn.classList.remove('loading');
  };

  if(vkBridge){
    vkBridge.send('VKWebAppCheckNativeAds',{ad_format:'reward'})
      .then(r=>{
        if(!r || !r.result){
          fail();
          return Promise.reject();
        }

        const adPromise = vkBridge.send('VKWebAppShowNativeAds',{ad_format:'reward'})
          .then(res=>{
            if(res && res.result) return 'success';
            return 'closed';
          })
          .catch(()=> 'error');

        const timerPromise = new Promise(resolve => {
          setTimeout(()=> resolve('timeout'), 5000);
        });

        return Promise.race([adPromise, timerPromise]);
      })
      .then(result=>{
        if(result === 'success' || result === 'timeout') {
          grant();
        } else {
          fail();
        }
      })
      .catch(()=>fail());
  }else{
    if(confirm('Показать рекламу (эмуляция) и получить другое задание?')) grant();
    else fail();
  }
}

rerollBtn.addEventListener('click', doReroll);

function requestUnlock(cat){
  const grant=()=>{
    unlocked[cat]=true;
    vkStorageSet('unlock_'+cat+'_'+dateKey(),'1');
    updateLocks();
    switchCategory(cat);
  };
  if(vkBridge){
    vkBridge.send('VKWebAppCheckNativeAds',{ad_format:'reward'})
      .then(r=>{
        if(!r || !r.result){
          return Promise.reject();
        }
        return vkBridge.send('VKWebAppShowNativeAds',{ad_format:'reward'});
      })
      .then(res=>{if(res && res.result) grant()})
      .catch(()=>{});
  }else{
    if(confirm('Показ рекламы (эмуляция). Открыть раздел на сегодня?')) grant();
  }
}

  ctx.beginPath();ctx.moveTo(W-30-cs,30);ctx.lineTo(W-30,30);ctx.lineTo(W-30,30+cs);ctx.stroke();

  ctx.fillStyle=starGrad;
  ctx.shadowColor='rgba(255,200,140,.5)';
  ctx.shadowBlur=30;
  ctx.beginPath();
  const R=70, r=8;
  ctx.moveTo(cx, cy-R);
  ctx.quadraticCurveTo(cx+r, cy-r, cx+R, cy);
  ctx.quadraticCurveTo(cx+r, cy+r, cx, cy+R);
  ctx.quadraticCurveTo(cx-r, cy+r, cx-R, cy);
  ctx.quadraticCurveTo(cx-r, cy-r, cx, cy-R);
  ctx.closePath();
  ctx.fill();
  ctx.shadowBlur=0;

  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.beginPath();
  const R2=14, r2=1.5;
  ctx.moveTo(cx, cy-R2);
  ctx.quadraticCurveTo(cx+r2, cy-r2, cx+R2, cy);
  ctx.quadraticCurveTo(cx+r2, cy+r2, cx, cy+R2);

  ctx.quadraticCurveTo(cx-r2, cy-r2, cx, cy-R2);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle='rgba(245,239,226,.75)';
  ctx.font='700 22px Unbounded, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='middle';
  ctx.letterSpacing='8px';
  ctx.fillText('ВЫЗОВ   ПРИНЯТ?', W/2, 310);

  ctx.strokeStyle='rgba(245,239,226,.28)';
  ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2-80,350);ctx.lineTo(W/2-10,350);ctx.stroke();
  ctx.beginPath();ctx.moveTo(W/2+10,350);ctx.lineTo(W/2+80,350);ctx.stroke();
  ctx.fillStyle=accent;
  ctx.beginPath();
  ctx.moveTo(W/2,346);ctx.lineTo(W/2+4,350);ctx.lineTo(W/2,354);ctx.lineTo(W/2-4,350);
  ctx.closePath();ctx.fill();

  const taskText = taskEl.textContent || 'Задание дня';
  ctx.fillStyle='#f5efe2';
  ctx.font='400 34px Unbounded, sans-serif';
  ctx.textAlign='center';
  ctx.textBaseline='top';
  wrapText(ctx, taskText, W/2, 400, W-140, 48);

  const catLabels={normal:'ОБЫЧНОЕ', hard:'СЛОЖНОЕ', adult:'ПАРЫ 18+'};
  ctx.fillStyle=accent;
  ctx.font='700 16px Unbounded, sans-serif';
  ctx.textAlign='center';
  ctx.fillText(catLabels[currentCategory] || 'ЗАДАНИЕ', W/2, H-180);

  ctx.fillStyle='rgba(245,239,226,.5)';
  ctx.font='400 14px Unbounded, sans-serif';
  ctx.fillText(APP_NAME + ' — ежедневные задания', W/2, H-130);

  ctx.fillStyle='rgba(245,239,226,.35)';
  ctx.font='400 12px Unbounded, sans-serif';
  ctx.fillText(APP_URL.replace('https://',''), W/2, H-100);
}

function wrapText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  let curY = y;
  for(let n=0; n<words.length; n++){
    const testLine = line + words[n] + ' ';
    const metrics = ctx.measureText(testLine);
    if(metrics.width > maxWidth && n > 0){
      ctx.fillText(line.trim(), x, curY);
      line = words[n] + ' ';
      curY += lineHeight;
    }else{
      line = testLine;
    }
  }
  ctx.fillText(line.trim(), x, curY);
}

function openShareModal(){
  renderShareCard();
  shareModal.classList.add('show');
}
function closeShareModal(){
  shareModal.classList.remove('show');
}

shareBtn.addEventListener('click', openShareModal);
modalClose.addEventListener('click', closeShareModal);
shareModal.addEventListener('click',(e)=>{
  if(e.target===shareModal) closeShareModal();
});

/* ============================================================
   СОХРАНЕНИЕ КАРТИНКИ — работает на Android через VK Bridge
   ============================================================ */
shareSaveBtn.addEventListener('click', () => {
  try {
    const dataUrl = shareCanvas.toDataURL('image/png');

    if (vkBridge) {
      // Нативный способ для Android/iOS — сохраняет в галерею
      vkBridge.send('VKWebAppDownloadFile', {
        url: dataUrl,
        filename: '360_challenge.png'
      })
        .then(() => {
          vkBridge.send('VKWebAppTapticImpactOccurred', { style: 'light' }).catch(() => {});
          setTimeout(closeShareModal, 400);
        })
        .catch((err) => {
          console.warn('[Save] VKWebAppDownloadFile failed, fallback:', err);
          // Fallback на браузерное скачивание (веб-версия)
          fallbackDownload(dataUrl);
          setTimeout(closeShareModal, 400);
        });
    } else {
      fallbackDownload(dataUrl);
      setTimeout(closeShareModal, 400);
    }
  } catch (err) {
    console.warn('[Save]', err);
  }
});

function fallbackDownload(dataUrl){
  try{
    const a = document.createElement('a');
    a.href = dataUrl;
    a.download = '360_challenge.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    if (navigator.vibrate) navigator.vibrate(15);
  }catch(e){
    console.warn('[Save fallback]', e);
  }
}

/* ============================================================
   СТАРТ ПРИЛОЖЕНИЯ
   ============================================================ */
function startApp(){
  loadProgress().then(() => {
    switchCategory('normal');
  }).catch(() => {
    // Если VK Storage совсем недоступен — работаем на localStorage
    switchCategory('normal');
  });
}

if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', () => {
    initVKBridge();
    startApp();
  });
} else {
  initVKBridge();
  startApp();
}
</script>
