name: Questy weekly stories checks
on:
  pull_request:
  push:
    branches:
      - feature/questy-weekly-three-offers-20261115
jobs:
  weekly-offers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-weekly.mjs
