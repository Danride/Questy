name: Questy stage 2 checks
on:
  pull_request:
  push:
    branches:
      - feature/questy-2-stage2-adventures
jobs:
  adventure-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-stage2.mjs
