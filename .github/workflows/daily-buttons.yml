name: Questy daily task buttons
on:
  pull_request:
  push:
    branches:
      - fix/daily-task-two-buttons-no-status-20261115
jobs:
  task-buttons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-task-buttons.mjs
